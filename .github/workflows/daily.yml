
name: NEXUS AI - Daily Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "15 9 * * *"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate content
        run: python scripts/validate_queue.py content/queue.json

      - name: Discover research topics
        run: python scripts/research_topics.py

      - name: Save research results
        uses: actions/upload-artifact@v4
        with:
          name: nexus-ai-discoveries
          path: discoveries.json
          if-no-files-found: warn
          retention-days: 7
